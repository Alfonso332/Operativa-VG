<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121826" />
    <title>Operativa VG</title>
    <style>
      :root { --bg:#f2f5fb; --card:#fff; --text:#0f172a; --muted:#5b6475; --primary:#3157f6; --primary-soft:#e6ebff; --radius:18px; --shadow:0 14px 38px rgba(17,24,39,.08); }
      * { box-sizing:border-box; }
      body { margin:0; font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--text); background:radial-gradient(circle at top,#e7ecfd 0,var(--bg) 48%); }
      .app-shell { min-height:100dvh; max-width:1200px; margin:0 auto; padding:1rem; }
      .topbar { display:flex; justify-content:space-between; align-items:center; gap:.8rem; }
      .topbar h1 { margin:.2rem 0 0; font-size:clamp(1.2rem,2.4vw,1.9rem); }
      .eyebrow { margin:0; color:var(--muted); font-size:.85rem; }
      .icon-btn { border:none; background:var(--card); border-radius:14px; width:44px; height:44px; box-shadow:var(--shadow); cursor:pointer; }
      .content { margin-top:1rem; }
      .card { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); }
      .hero-card { padding:1rem; display:flex; gap:.75rem; align-items:center; justify-content:space-between; flex-wrap:wrap; }
      .hero-actions { display:flex; gap:.5rem; flex-wrap:wrap; }
      .btn { border:none; border-radius:12px; padding:.7rem .95rem; font-weight:600; cursor:pointer; }
      .btn-primary { background:var(--primary); color:#fff; }
      .btn-soft { background:var(--primary-soft); color:#1a2b68; }
      .metrics-grid { display:grid; gap:.8rem; grid-template-columns:repeat(auto-fit,minmax(175px,1fr)); margin-top:1rem; }
      .metric-card { padding:.95rem; }
      .metric-card h3 { margin:0; font-size:.85rem; color:var(--muted); }
      .metric-card strong { display:block; margin-top:.35rem; font-size:1.35rem; }
      .metric-card span { color:var(--muted); font-size:.82rem; }
      .section-title { margin:0 0 .7rem; font-size:1rem; }
      .panel { padding:1rem; }
      .seller-list,.service-list,.news-list { display:grid; gap:.55rem; }
      .seller-item,.service-item,.news-item { border:1px solid #e7ebf5; border-radius:12px; padding:.7rem; background:#fafcff; }
      .seller-item { display:grid; grid-template-columns:1fr auto; align-items:center; gap:.4rem; text-align:left; cursor:pointer; }
      .seller-item h4 { margin:0; font-size:.93rem; }
      .seller-item small,.news-item small { color:var(--muted); }
      .chip { font-size:.76rem; padding:.22rem .46rem; border-radius:999px; font-weight:600; }
      .chip-ok { color:#05543a; background:#d8f7e8; }
      .chip-warn { color:#7b4a00; background:#ffe9ca; }
      .kpi-mini-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem; margin-top:.7rem; }
      .kpi-mini { background:#f8faff; border-radius:10px; padding:.55rem; }
      .kpi-mini b { display:block; }
      .kpi-mini span { font-size:.75rem; color:var(--muted); }
      .form-stack { display:grid; gap:.55rem; }
      .input,.select { width:100%; border:1px solid #dfe5f2; border-radius:10px; padding:.65rem; background:#fff; }
      .windows { position:relative; min-height:60vh; }
      .app-window { display:none; animation:fade .2s ease; }
      .app-window.active { display:block; }
      @keyframes fade { from { opacity:0; transform:translateY(4px);} to {opacity:1; transform:translateY(0);} }
      .mobile-tabbar { display:none; }

      @media (max-width:768px){
        body { background:#121826; }
        .app-shell { max-width:480px; background:linear-gradient(180deg,#1e2a44 0%,#111827 24%,#0f172a 100%); padding:calc(env(safe-area-inset-top)+.8rem) .8rem calc(env(safe-area-inset-bottom)+5.2rem); }
        .topbar h1,.section-title,.seller-item h4,.metric-card strong { color:#e8edff; }
        .eyebrow,.metric-card h3,.metric-card span,.seller-item small,.kpi-mini span,.news-item small { color:#9fb1d9; }
        .card,.icon-btn,.seller-item,.service-item,.news-item,.kpi-mini { background:rgba(255,255,255,.06); backdrop-filter:blur(10px); border:1px solid rgba(173,196,255,.13); box-shadow:none; }
        .btn-soft { background:rgba(92,126,255,.22); color:#dde7ff; }
        .input,.select { background:rgba(255,255,255,.04); border:1px solid rgba(173,196,255,.2); color:#e8edff; }
        .metrics-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
        .mobile-tabbar { display:grid; grid-template-columns:repeat(5,1fr); gap:.2rem; position:fixed; left:50%; transform:translateX(-50%); bottom:max(.6rem,env(safe-area-inset-bottom)); width:min(95vw,460px); background:rgba(14,22,40,.9); border:1px solid rgba(160,184,238,.18); border-radius:22px; padding:.45rem; backdrop-filter:blur(12px); }
        .tab { border:none; background:transparent; color:#9fb1d9; padding:.3rem 0; display:flex; flex-direction:column; align-items:center; gap:.15rem; border-radius:12px; cursor:pointer; }
        .tab-icon { width:20px; height:20px; display:inline-flex; }
        .tab-icon svg { width:100%; height:100%; stroke:currentColor; fill:none; stroke-width:1.8; }
        .tab span { font-size:.68rem; }
        .tab.active { color:#fff; background:rgba(56,96,255,.3); }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div><p class="eyebrow">Operativa</p><h1>Panel Comercial</h1></div>
        <button class="icon-btn" id="openNotifications" aria-label="Notificaciones">🔔</button>
      </header>

      <main class="content">
        <section class="windows">
          <article class="app-window active" id="window-inicio">
            <section class="hero-card card">
              <h2>Control de ventas y operación</h2>
              <div class="hero-actions">
                <button class="btn btn-primary" id="createOperationBtn">Nueva venta</button>
                <button class="btn btn-soft" id="refreshBtn">Actualizar KPIs</button>
              </div>
            </section>
            <section class="metrics-grid" id="generalMetrics"></section>
          </article>

          <article class="app-window" id="window-equipo">
            <section class="panel card">
              <h3 class="section-title">Vendedores y KPIs</h3>
              <div class="seller-list" id="sellerList"></div>
              <div id="sellerKpiDetail"></div>
            </section>
          </article>

          <article class="app-window" id="window-nuevo">
            <section class="panel card">
              <h3 class="section-title">Nueva venta</h3>
              <form class="form-stack" id="newSaleForm">
                <input class="input" id="saleClient" placeholder="Cliente" required />
                <input class="input" id="saleAmount" placeholder="Monto" required />
                <select class="select" id="saleSeller" required></select>
                <button class="btn btn-primary" type="submit">Guardar venta</button>
              </form>
            </section>
          </article>

          <article class="app-window" id="window-servicios">
            <section class="panel card">
              <h3 class="section-title">Servicios</h3>
              <form class="form-stack" id="serviceForm">
                <input class="input" id="serviceName" placeholder="Nombre del servicio" required />
                <select class="select" id="serviceArea" required><option value="">Selecciona un área</option><option>Logística</option><option>Postventa</option><option>Soporte</option><option>Comercial</option></select>
                <button class="btn btn-primary" type="submit">Agregar servicio</button>
              </form>
              <div class="service-list" id="serviceList" style="margin-top:.8rem"></div>
            </section>
          </article>

          <article class="app-window" id="window-avisos">
            <section class="panel card">
              <h3 class="section-title">Novedades / Notificaciones</h3>
              <div class="news-list" id="newsList"></div>
            </section>
          </article>
        </section>
      </main>

      <nav class="mobile-tabbar" aria-label="Navegación inferior">
        <button class="tab active" data-view="inicio" aria-current="page"><span class="tab-icon"><svg viewBox="0 0 24 24"><path d="M3 11.5L12 4l9 7.5"/><path d="M6.5 10.5V20h11V10.5"/></svg></span><span>Inicio</span></button>
        <button class="tab" data-view="equipo"><span class="tab-icon"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.8 18c.7-2.7 2.7-4 5.2-4s4.5 1.3 5.2 4"/><circle cx="17" cy="9" r="2.2"/><path d="M14.5 17.5c.6-1.7 1.9-2.7 3.8-2.9"/></svg></span><span>Equipo</span></button>
        <button class="tab" data-view="nuevo"><span class="tab-icon"><svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg></span><span>Nuevo</span></button>
        <button class="tab" data-view="servicios"><span class="tab-icon"><svg viewBox="0 0 24 24"><path d="M6 7.5h12"/><path d="M6 12h12"/><path d="M6 16.5h8"/><rect x="4" y="4" width="16" height="16" rx="2.5"/></svg></span><span>Servicios</span></button>
        <button class="tab" data-view="avisos"><span class="tab-icon"><svg viewBox="0 0 24 24"><path d="M6.5 8a5.5 5.5 0 1 1 11 0c0 4.8 2 5.5 2 5.5h-15S6.5 12.8 6.5 8Z"/><path d="M10 17.5a2 2 0 0 0 4 0"/></svg></span><span>Avisos</span></button>
      </nav>
    </div>

    <script>
      const state = {
        generalMetrics:[{title:'Ventas hoy',value:'$ 2.180.000',sub:'+15% vs ayer'},{title:'Operaciones cerradas',value:'34',sub:'6 en la última hora'},{title:'Ticket promedio',value:'$ 64.120',sub:'Meta: $ 60.000'},{title:'Conversión',value:'27%',sub:'+2.1 pp semanal'}],
        sellers:[{name:'Camila Pérez',area:'Zona Norte',status:'ok',sales:'$ 620.000',ops:11,conv:'31%'},{name:'Matías Ríos',area:'Zona Centro',status:'ok',sales:'$ 540.000',ops:9,conv:'29%'},{name:'Valentina Sosa',area:'E-commerce',status:'warn',sales:'$ 410.000',ops:7,conv:'22%'},{name:'Nicolás Díaz',area:'Empresas',status:'ok',sales:'$ 610.000',ops:10,conv:'30%'}],
        services:[{name:'Instalación express',area:'Postventa'},{name:'Seguimiento premium',area:'Soporte'}],
        news:[{text:'Nueva lista de precios activa desde las 14:00.',time:'hace 15 min'},{text:'Objetivo semanal del equipo en 82% de cumplimiento.',time:'hace 40 min'}],
        selectedSeller:0
      };
      const els = {
        generalMetrics:document.getElementById('generalMetrics'), sellerList:document.getElementById('sellerList'), sellerKpiDetail:document.getElementById('sellerKpiDetail'),
        serviceList:document.getElementById('serviceList'), newsList:document.getElementById('newsList'), saleSeller:document.getElementById('saleSeller')
      };
      function renderMetrics(){els.generalMetrics.innerHTML=state.generalMetrics.map(m=>`<article class="metric-card card"><h3>${m.title}</h3><strong>${m.value}</strong><span>${m.sub}</span></article>`).join('');}
      function renderSellers(){els.sellerList.innerHTML=state.sellers.map((s,i)=>`<button class="seller-item" data-index="${i}"><div><h4>${s.name}</h4><small>${s.area}</small></div><span class="chip ${s.status==='ok'?'chip-ok':'chip-warn'}">${s.status==='ok'?'En objetivo':'A revisar'}</span></button>`).join(''); [...els.sellerList.querySelectorAll('.seller-item')].forEach(b=>b.addEventListener('click',()=>{state.selectedSeller=Number(b.dataset.index);renderSellerDetail();}));}
      function renderSellerDetail(){const s=state.sellers[state.selectedSeller];els.sellerKpiDetail.innerHTML=`<div class="kpi-mini-grid"><article class="kpi-mini"><b>${s.sales}</b><span>Ventas acumuladas</span></article><article class="kpi-mini"><b>${s.ops}</b><span>Operaciones</span></article><article class="kpi-mini"><b>${s.conv}</b><span>Conversión</span></article></div>`;}
      function renderServices(){els.serviceList.innerHTML=state.services.map(s=>`<article class="service-item"><strong>${s.name}</strong><small>${s.area}</small></article>`).join('');}
      function renderNews(){els.newsList.innerHTML=state.news.map(n=>`<article class="news-item"><p>${n.text}</p><small>${n.time}</small></article>`).join('');}
      function renderSaleSellerOptions(){els.saleSeller.innerHTML='<option value="">Selecciona vendedor</option>'+state.sellers.map(s=>`<option>${s.name}</option>`).join('');}

      function setActiveView(view){document.querySelectorAll('.app-window').forEach(w=>w.classList.remove('active'));const windowEl=document.getElementById(`window-${view}`)||document.getElementById('window-inicio');windowEl.classList.add('active');document.querySelectorAll('.tab').forEach(t=>{t.classList.remove('active');t.removeAttribute('aria-current');if(t.dataset.view===view){t.classList.add('active');t.setAttribute('aria-current','page');}});}

      function setupInteractions(){
        document.getElementById('createOperationBtn').addEventListener('click',()=>setActiveView('nuevo'));
        document.getElementById('refreshBtn').addEventListener('click',()=>{state.generalMetrics[1].sub=`${Math.floor(Math.random()*8)+3} en la última hora`;renderMetrics();});
        document.getElementById('openNotifications').addEventListener('click',()=>{setActiveView('avisos');});
        document.getElementById('serviceForm').addEventListener('submit',(e)=>{e.preventDefault();const n=document.getElementById('serviceName');const a=document.getElementById('serviceArea');state.services.unshift({name:n.value.trim(),area:a.value});renderServices();n.value='';a.value='';});
        document.getElementById('newSaleForm').addEventListener('submit',(e)=>{e.preventDefault();const c=document.getElementById('saleClient');const m=document.getElementById('saleAmount');const v=els.saleSeller;window.alert(`Venta guardada: ${c.value} - ${m.value} (${v.value})`);c.value='';m.value='';v.value='';setActiveView('inicio');});
        document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>setActiveView(tab.dataset.view)));
      }

      renderMetrics(); renderSellers(); renderSellerDetail(); renderServices(); renderNews(); renderSaleSellerOptions(); setupInteractions();
    </script>
  </body>
</html>
