<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1e35" />
    <title>MASTERSON Security App</title>
    <style>
      :root {
        --bg: #081326;
        --card: rgba(255, 255, 255, 0.08);
        --line: rgba(138, 191, 255, 0.25);
        --text: #eaf3ff;
        --muted: #a9c3e5;
        --primary: #12b3ff;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 10% 0%, #17406f 0%, transparent 45%),
          radial-gradient(circle at 95% -10%, #103e57 0%, transparent 40%),
          linear-gradient(180deg, #0b1e35 0%, var(--bg) 55%, #050b16 100%);
      }

      .app { max-width: 520px; margin: 0 auto; min-height: 100dvh; padding: calc(env(safe-area-inset-top) + 0.8rem) 0.85rem calc(env(safe-area-inset-bottom) + 5.2rem); }
      .topbar { display: flex; justify-content: space-between; align-items: center; }
      .brand small { color: var(--muted); }
      .brand h1 { margin: 0.12rem 0 0; font-size: 1.25rem; letter-spacing: 0.3px; }
      .icon-btn { width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 13px; background: var(--card); color: var(--text); }

      .view { display: none; }
      .view.active { display: grid; gap: 0.75rem; margin-top: 0.85rem; }

      .card { border: 1px solid var(--line); background: var(--card); border-radius: 16px; backdrop-filter: blur(12px); box-shadow: 0 12px 26px rgba(2, 6, 20, 0.35); }
      .hero { padding: 0.9rem; display: grid; gap: 0.75rem; }
      .hero h2 { margin: 0; font-size: 1.03rem; }
      .hero p { margin: 0; color: var(--muted); font-size: 0.88rem; }
      .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.55rem; }
      .btn { border: none; border-radius: 11px; min-height: 42px; font-weight: 650; }
      .btn-primary { background: linear-gradient(180deg, #35c3ff, var(--primary)); color: #032640; }
      .btn-soft { background: rgba(18, 179, 255, 0.18); color: #dff3ff; border: 1px solid rgba(111, 207, 255, 0.32); }

      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.55rem; }
      .metric { padding: 0.72rem; }
      .metric h3 { margin: 0; color: var(--muted); font-size: 0.78rem; font-weight: 600; }
      .metric strong { display: block; margin-top: 0.3rem; font-size: 1.22rem; }
      .metric span { font-size: 0.75rem; color: var(--muted); }

      .panel { padding: 0.85rem; }
      .panel h3 { margin: 0 0 0.55rem; font-size: 0.95rem; }
      .list { display: grid; gap: 0.5rem; }
      .item { border: 1px solid rgba(147, 196, 255, 0.2); background: rgba(255, 255, 255, 0.04); border-radius: 11px; padding: 0.6rem; }
      .row { display: flex; justify-content: space-between; gap: 0.45rem; align-items: center; }
      .item b { font-size: 0.9rem; }
      .item small { color: var(--muted); }

      .chip { font-size: 0.7rem; border-radius: 999px; padding: 0.2rem 0.4rem; font-weight: 700; }
      .chip-ok { background: rgba(45, 212, 191, 0.2); color: #8ff4e6; }
      .chip-warn { background: rgba(245, 158, 11, 0.2); color: #ffd28a; }
      .chip-danger { background: rgba(244, 63, 94, 0.2); color: #ff9eb2; }

      .incident-form { display: grid; gap: 0.45rem; }
      .field { width: 100%; border-radius: 10px; border: 1px solid rgba(147, 196, 255, 0.28); background: rgba(7, 23, 42, 0.8); color: var(--text); padding: 0.58rem; }

      .tabbar {
        position: fixed; left: 50%; transform: translateX(-50%); bottom: max(0.52rem, env(safe-area-inset-bottom));
        width: min(96vw, 500px); border: 1px solid rgba(129, 198, 255, 0.3); border-radius: 19px;
        background: rgba(5, 16, 30, 0.84); backdrop-filter: blur(12px); padding: 0.4rem;
        display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.18rem;
      }
      .tab {
        border: none; background: rgba(255, 255, 255, 0.95); color: #000;
        display: flex; flex-direction: column; align-items: center; gap: 0.15rem;
        border-radius: 11px; padding: 0.32rem 0; font-size: 0.96rem;
      }
      .tab-icon { width: 18px; height: 18px; display: inline-flex; }
      .tab-icon svg { width: 100%; height: 100%; stroke: #000; fill: none; stroke-width: 1.8; }
      .tab span { font-size: 0.66rem; color: #000; }
      .tab.active { background: #ffffff; box-shadow: inset 0 0 0 2px #000; }

      @media (min-width: 900px) {
        .app { max-width: 1060px; }
        .tabbar { position: static; transform: none; width: 100%; margin-top: 0.7rem; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <small>MASTERSON SECURITY</small>
          <h1>Centro de Operaciones</h1>
        </div>
        <button class="icon-btn" id="notifBtn" aria-label="Notificaciones">🔔</button>
      </header>

      <main>
        <section class="view active" id="view-inicio">
          <section class="card hero">
            <h2>Estado general: Cobertura Activa</h2>
            <p>24 zonas monitoreadas · 3 móviles en patrulla · 1 alerta de prioridad media.</p>
            <div class="actions">
              <button class="btn btn-primary" id="newIncidentQuick">Nuevo incidente</button>
              <button class="btn btn-soft" id="refreshOps">Actualizar estado</button>
            </div>
          </section>
          <section class="grid" id="metrics"></section>
        </section>

        <section class="view" id="view-equipo">
          <section class="card panel">
            <h3>Equipo en servicio</h3>
            <div class="list" id="guards"></div>
          </section>
        </section>

        <section class="view" id="view-incidentes">
          <section class="card panel">
            <h3>Registro rápido de incidente</h3>
            <form class="incident-form" id="incidentForm">
              <input class="field" id="incidentTitle" placeholder="Título del incidente" required />
              <select class="field" id="incidentPriority" required>
                <option value="">Prioridad</option>
                <option>Alta</option>
                <option>Media</option>
                <option>Baja</option>
              </select>
              <input class="field" id="incidentZone" placeholder="Zona / Objetivo" required />
              <button class="btn btn-primary" type="submit">Crear incidente</button>
            </form>
          </section>
        </section>

        <section class="view" id="view-rutas">
          <section class="card panel">
            <h3>Rutas y móviles</h3>
            <div class="list" id="routes"></div>
          </section>
        </section>

        <section class="view" id="view-alertas">
          <section class="card panel">
            <h3>Alertas y novedades</h3>
            <div class="list" id="alerts"></div>
          </section>
        </section>
      </main>

      <nav class="tabbar" aria-label="Navegación">
        <button class="tab active" data-target="view-inicio">
          <span class="tab-icon"><svg viewBox="0 0 24 24"><path d="M3 11.5L12 4l9 7.5"/><path d="M6.5 10.5V20h11V10.5"/></svg></span><span>Inicio</span>
        </button>
        <button class="tab" data-target="view-equipo">
          <span class="tab-icon"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.8 18c.7-2.7 2.7-4 5.2-4s4.5 1.3 5.2 4"/><circle cx="17" cy="9" r="2.2"/><path d="M14.5 17.5c.6-1.7 1.9-2.7 3.8-2.9"/></svg></span><span>Equipo</span>
        </button>
        <button class="tab" data-target="view-incidentes">
          <span class="tab-icon"><svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg></span><span>Incidente</span>
        </button>
        <button class="tab" data-target="view-rutas">
          <span class="tab-icon"><svg viewBox="0 0 24 24"><path d="M12 21s6-5.4 6-11a6 6 0 1 0-12 0c0 5.6 6 11 6 11Z"/><circle cx="12" cy="10" r="2.2"/></svg></span><span>Rutas</span>
        </button>
        <button class="tab" data-target="view-alertas">
          <span class="tab-icon"><svg viewBox="0 0 24 24"><path d="M6.5 8a5.5 5.5 0 1 1 11 0c0 4.8 2 5.5 2 5.5h-15S6.5 12.8 6.5 8Z"/><path d="M10 17.5a2 2 0 0 0 4 0"/></svg></span><span>Alertas</span>
        </button>
      </nav>
    </div>

    <script>
      const state = {
        metrics: [
          { t: 'Guardias activos', v: '58', s: '4 en relevo' },
          { t: 'Incidentes hoy', v: '12', s: '2 abiertos' },
          { t: 'Tiempo respuesta', v: '4m 10s', s: '-18% vs ayer' },
          { t: 'Cumplimiento ronda', v: '96%', s: 'Objetivo 95%' }
        ],
        guards: [
          { n: 'Lucía Mena', z: 'Planta Norte', st: 'ok', shift: 'Nocturno', incidents: 0 },
          { n: 'Diego Arce', z: 'Puerto Seco', st: 'warn', shift: 'Tarde', incidents: 1 },
          { n: 'Micaela Ríos', z: 'Torre Central', st: 'ok', shift: 'Mañana', incidents: 0 },
          { n: 'Renzo Vidal', z: 'Parque Logístico', st: 'danger', shift: 'Nocturno', incidents: 2 }
        ],
        routes: [
          { mobile: 'Móvil 01', area: 'Anillo Norte', eta: '6 min' },
          { mobile: 'Móvil 04', area: 'Corredor Industrial', eta: '9 min' },
          { mobile: 'Móvil 07', area: 'Zona Portuaria', eta: '4 min' }
        ],
        alerts: [
          { m: 'Sensor perimetral activado en Depósito 3.', level: 'Media' },
          { m: 'Ronda completada en Torre Central.', level: 'Baja' },
          { m: 'Solicitud de apoyo táctico en Puerto Seco.', level: 'Alta' }
        ]
      };

      const metricsEl = document.getElementById('metrics');
      const guardsEl = document.getElementById('guards');
      const routesEl = document.getElementById('routes');
      const alertsEl = document.getElementById('alerts');

      function chip(level) {
        if (level === 'Alta' || level === 'danger') return 'chip chip-danger';
        if (level === 'Media' || level === 'warn') return 'chip chip-warn';
        return 'chip chip-ok';
      }

      function render() {
        metricsEl.innerHTML = state.metrics.map((m) => `<article class="card metric"><h3>${m.t}</h3><strong>${m.v}</strong><span>${m.s}</span></article>`).join('');
        guardsEl.innerHTML = state.guards.map((g) => `<article class="item"><div class="row"><b>${g.n}</b><span class="${chip(g.st)}">${g.st === 'ok' ? 'Operativo' : g.st === 'warn' ? 'Atención' : 'Crítico'}</span></div><small>${g.z} · Turno ${g.shift} · Incidentes ${g.incidents}</small></article>`).join('');
        routesEl.innerHTML = state.routes.map((r) => `<article class="item"><div class="row"><b>${r.mobile}</b><span class="chip chip-ok">ETA ${r.eta}</span></div><small>${r.area}</small></article>`).join('');
        alertsEl.innerHTML = state.alerts.map((a) => `<article class="item"><div class="row"><b>${a.level}</b><span class="${chip(a.level)}">${a.level}</span></div><small>${a.m}</small></article>`).join('');
      }

      function setView(targetId) {
        document.querySelectorAll('.view').forEach((v) => v.classList.remove('active'));
        document.getElementById(targetId)?.classList.add('active');
        document.querySelectorAll('.tab').forEach((t) => {
          t.classList.remove('active');
          if (t.dataset.target === targetId) t.classList.add('active');
        });
      }

      function setup() {
        document.querySelectorAll('.tab').forEach((tab) => {
          tab.addEventListener('click', () => setView(tab.dataset.target));
        });

        document.getElementById('newIncidentQuick').addEventListener('click', () => setView('view-incidentes'));
        document.getElementById('refreshOps').addEventListener('click', () => {
          state.metrics[1].v = String(Number(state.metrics[1].v) + 1);
          render();
        });
        document.getElementById('notifBtn').addEventListener('click', () => setView('view-alertas'));

        document.getElementById('incidentForm').addEventListener('submit', (e) => {
          e.preventDefault();
          const title = document.getElementById('incidentTitle');
          const priority = document.getElementById('incidentPriority');
          const zone = document.getElementById('incidentZone');
          state.alerts.unshift({ m: `${title.value} en ${zone.value}.`, level: priority.value });
          title.value = '';
          priority.value = '';
          zone.value = '';
          render();
          setView('view-alertas');
        });
      }

      render();
      setup();
    </script>
  </body>
</html>
